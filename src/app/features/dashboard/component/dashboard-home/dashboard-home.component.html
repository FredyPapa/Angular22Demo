<div class="container-fluid py-4 bg-light">

  <!-- FILA 1: Métricas Principales -->
  <div class="row g-4 mb-4">
    <!-- Tarjeta 1: Ventas -->
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 border-0 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="text-muted text-uppercase fs-7 mb-1">Ventas Totales</h6>
              <h3 class="fw-bold mb-0">$24,500</h3>
            </div>
            <div class="bg-primary-subtle text-primary rounded p-3">
              <i class="bi bi-currency-dollar fs-4"></i>
            </div>
          </div>
          <div class="mt-3">
            <span class="text-success fw-semibold"><i class="bi bi-arrow-up"></i> +12%</span>
            <span class="text-muted ms-1">desde el mes pasado</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Tarjeta 2: Nuevos Usuarios -->
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 border-0 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="text-muted text-uppercase fs-7 mb-1">Nuevos Usuarios</h6>
              <h3 class="fw-bold mb-0">1,240</h3>
            </div>
            <div class="bg-success-subtle text-success rounded p-3">
              <i class="bi bi-people fs-4"></i>
            </div>
          </div>
          <div class="mt-3">
            <span class="text-success fw-semibold"><i class="bi bi-arrow-up"></i> +5.3%</span>
            <span class="text-muted ms-1">esta semana</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Tarjeta 3: Tasa de Conversión -->
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 border-0 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="text-muted text-uppercase fs-7 mb-1">Tasa de Conversión</h6>
              <h3 class="fw-bold mb-0">3.42%</h3>
            </div>
            <div class="bg-warning-subtle text-warning rounded p-3">
              <i class="bi bi-graph-up-arrow fs-4"></i>
            </div>
          </div>
          <div class="mt-3">
            <span class="text-danger fw-semibold"><i class="bi bi-arrow-down"></i> -0.8%</span>
            <span class="text-muted ms-1">comparado con ayer</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- FILA 2: Métricas Secundarias -->
  <div class="row g-4">
    <!-- Tarjeta 4: Pedidos Pendientes -->
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 border-0 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="text-muted text-uppercase fs-7 mb-1">Pedidos Pendientes</h6>
              <h3 class="fw-bold mb-0">45</h3>
            </div>
            <div class="bg-danger-subtle text-danger rounded p-3">
              <i class="bi bi-cart-dash fs-4"></i>
            </div>
          </div>
          <div class="mt-3">
            <span class="badge bg-danger rounded-pill">Atención requerida</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Tarjeta 5: Tiempo de Respuesta -->
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 border-0 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="text-muted text-uppercase fs-7 mb-1">Tiempo de Respuesta</h6>
              <h3 class="fw-bold mb-0">1.8 hrs</h3>
            </div>
            <div class="bg-info-subtle text-info rounded p-3">
              <i class="bi bi-clock-history fs-4"></i>
            </div>
          </div>
          <div class="mt-3">
            <span class="text-success fw-semibold"><i class="bi bi-arrow-up"></i> -15 min</span>
            <span class="text-muted ms-1">promedio diario</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Tarjeta 6: Satisfacción -->
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 border-0 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="text-muted text-uppercase fs-7 mb-1">Satisfacción (CSAT)</h6>
              <h3 class="fw-bold mb-0">94.8%</h3>
            </div>
            <div class="bg-dark-subtle text-dark rounded p-3">
              <i class="bi bi-emoji-smile fs-4"></i>
            </div>
          </div>
          <div class="mt-3">
            <span class="text-success fw-semibold"><i class="bi bi-arrow-up"></i> +2.1%</span>
            <span class="text-muted ms-1">este trimestre</span>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
