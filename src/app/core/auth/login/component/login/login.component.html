<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="row w-100 justify-content-center">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">

      <!-- Tarjeta del Login -->
      <div class="card border-0 shadow-sm p-4">
        <div class="card-body">

          <!-- Encabezado / Logo -->
          <div class="text-center mb-4">
            <div class="bg-primary text-white d-inline-block rounded-circle p-3 mb-2">
              <i class="bi bi-shield-lock-fill fs-3"></i>
            </div>
            <h3 class="fw-bold text-dark">Bienvenido</h3>
            <p class="text-muted small">Ingresa tus credenciales para acceder</p>
          </div>

          <!-- Formulario -->
          <form autocomplete="off">

            <!-- Campo: Correo Electrónico -->
            <div class="mb-3">
              <label for="emailInput" class="form-label text-muted small fw-semibold">Correo Electrónico</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0 text-muted">
                  <i class="bi bi-envelope"></i>
                </span>
                <input
                  type="email"
                  class="form-control border-start-0 ps-0"
                  id="emailInput"
                  placeholder="nombre@ejemplo.com"
                  >
              </div>
            </div>

            <!-- Campo: Contraseña -->
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="passwordInput" class="form-label text-muted small fw-semibold mb-0">Contraseña</label>
                <a href="#recuperar" class="text-primary small text-decoration-none">¿La olvidaste?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0 text-muted">
                  <i class="bi bi-lock"></i>
                </span>
                <input
                  type="password"
                  class="form-control border-start-0 ps-0"
                  id="passwordInput"
                  placeholder="••••••••"
                  >
              </div>
            </div>

            <!-- Recordarme -->
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="rememberMe">
              <label class="form-check-label text-muted small" for="rememberMe">
                Recordarme en este equipo
              </label>
            </div>

            <!-- Botón de Acción -->
            <button type="button" class="btn btn-primary w-100 py-2 fw-semibold mb-3" (click)="login()">
              Iniciar Sesión
            </button>

            <!-- Registro Alternativo -->
            <div class="text-center">
              <span class="text-muted small">¿No tienes una cuenta?</span>
              <a href="#registro" class="text-primary small fw-semibold text-decoration-none ms-1">Regístrate</a>
            </div>

          </form>

        </div>
      </div> <!-- Fin Tarjeta -->

    </div>
  </div>
</div>
